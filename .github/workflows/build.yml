name: "Build and Test"
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-on-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsodium-dev
      - name: "Build and Test"
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}
          make
          ./test_hkdf_hmacsha512